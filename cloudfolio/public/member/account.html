<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — CloudFolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body style="background:rgb(var(--bg));min-height:100vh;">

  <!-- Header -->
  <header style="background:rgb(var(--surface));border-bottom:1px solid rgb(var(--border));padding:0 1.5rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:var(--shadow-sm);">
    <div style="display:flex;align-items:center;gap:1.25rem;">
      <div style="display:flex;align-items:center;gap:0.5rem;">
        <i data-lucide="library" style="width:20px;height:20px;color:rgb(var(--accent));"></i>
        <span style="font-family:'Crimson Pro',Georgia,serif;font-size:1.25rem;font-weight:700;color:rgb(var(--text-primary));">Cloud<span style="color:rgb(var(--accent));">Folio</span></span>
      </div>
      <nav style="display:flex;gap:0.25rem;">
        <a href="/member/account.html" style="padding:0.375rem 0.875rem;border-radius:0.5rem;font-size:0.875rem;font-weight:600;color:rgb(var(--accent));background:rgba(var(--accent)/0.08);text-decoration:none;">My Account</a>
        <a href="/member/catalog.html" style="padding:0.375rem 0.875rem;border-radius:0.5rem;font-size:0.875rem;font-weight:500;color:rgb(var(--text-secondary));text-decoration:none;transition:background 0.15s,color 0.15s;" onmouseover="this.style.background='rgb(var(--surface-2))'" onmouseout="this.style.background='transparent'">Catalog</a>
      </nav>
    </div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <div id="user-badge" style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:rgb(var(--text-secondary));"></div>
      <button id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="Toggle theme">
        <span class="theme-sun"><i data-lucide="sun" style="width:16px;height:16px;"></i></span>
        <span class="theme-moon"><i data-lucide="moon" style="width:16px;height:16px;"></i></span>
      </button>
      <button id="logout-btn" class="btn btn-secondary btn-sm" style="display:flex;align-items:center;gap:0.375rem;">
        <i data-lucide="log-out" style="width:14px;height:14px;"></i>
        Logout
      </button>
    </div>
  </header>

  <main style="max-width:1100px;margin:0 auto;padding:1.5rem;" class="fade-in">

    <!-- Loading state -->
    <div id="loading-state" style="display:flex;align-items:center;justify-content:center;padding:4rem;flex-direction:column;gap:1rem;">
      <div class="spinner spinner-dark" style="width:32px;height:32px;border-width:3px;"></div>
      <span style="color:rgb(var(--text-muted));">Loading your account...</span>
    </div>

    <!-- Content (hidden until loaded) -->
    <div id="account-content" style="display:none;">

      <!-- Welcome Section -->
      <div style="margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;">
        <div>
          <h1 style="font-family:'Crimson Pro',Georgia,serif;font-size:1.75rem;font-weight:700;color:rgb(var(--text-primary));">
            Welcome back, <span id="member-name"></span>
          </h1>
          <div style="font-size:0.875rem;color:rgb(var(--text-muted));margin-top:0.25rem;" id="member-email"></div>
        </div>
        <div id="status-badge-container"></div>
      </div>

      <!-- Status Banner -->
      <div id="status-banner" style="display:none;border-radius:0.625rem;padding:0.875rem 1.125rem;margin-bottom:1.25rem;font-size:0.875rem;display:flex;align-items:center;gap:0.625rem;"></div>

      <!-- Stats Row -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--info)/0.12);">
            <i data-lucide="book-open" style="width:20px;height:20px;color:rgb(var(--info));"></i>
          </div>
          <div>
            <div class="stat-label">Active Loans</div>
            <div class="stat-value" id="stat-active-loans">—</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--danger)/0.12);">
            <i data-lucide="banknote" style="width:20px;height:20px;color:rgb(var(--danger));"></i>
          </div>
          <div>
            <div class="stat-label">Pending Fines</div>
            <div class="stat-value" id="stat-pending-fines">—</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--success)/0.12);">
            <i data-lucide="user-check" style="width:20px;height:20px;color:rgb(var(--success));"></i>
          </div>
          <div>
            <div class="stat-label">Account Status</div>
            <div id="stat-status" style="margin-top:0.25rem;"></div>
          </div>
        </div>
      </div>

      <!-- 2-col Card Grid: Current Loans | Outstanding Fines -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem;" id="cards-grid">

        <!-- Current Loans Card -->
        <div class="card">
          <div class="card-header">
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <i data-lucide="book-open" style="width:16px;height:16px;color:rgb(var(--info));"></i>
              <span class="card-title">Current Loans</span>
            </div>
          </div>
          <div class="card-body" style="padding:0;">
            <div id="current-loans-list"></div>
          </div>
        </div>

        <!-- Outstanding Fines Card -->
        <div class="card">
          <div class="card-header">
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <i data-lucide="dollar-sign" style="width:16px;height:16px;color:rgb(var(--danger));"></i>
              <span class="card-title">Outstanding Fines</span>
            </div>
          </div>
          <div class="card-body" style="padding:0;">
            <div id="fines-list"></div>
            <div id="fines-total" style="display:none;padding:0.75rem 1rem;border-top:1px solid rgb(var(--border));display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:0.875rem;font-weight:600;color:rgb(var(--text-primary));">Total</span>
              <span id="fines-total-amount" style="font-weight:700;color:rgb(var(--danger));"></span>
            </div>
            <div id="pay-btn-row" style="display:none;padding:0.75rem 1rem;padding-top:0;">
              <button class="btn btn-primary" style="width:100%;" onclick="showToast('Payment portal is not available in demo','info')">Pay Fines</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Loan History -->
      <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <i data-lucide="clock" style="width:16px;height:16px;color:rgb(var(--text-muted));"></i>
            <span class="card-title">Loan History</span>
          </div>
        </div>
        <div id="loan-history-table"></div>
      </div>

      <!-- Notifications -->
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <i data-lucide="bell" style="width:16px;height:16px;color:rgb(var(--accent));"></i>
            <span class="card-title">Notifications</span>
          </div>
        </div>
        <div class="card-body" id="notifications-list" style="display:flex;flex-direction:column;gap:0.625rem;"></div>
      </div>

    </div>
  </main>

  <style>
    .loan-item, .fine-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgb(var(--border));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .loan-item:last-child, .fine-item:last-child { border-bottom: none; }
    .empty-card-msg {
      padding: 2rem 1rem;
      text-align: center;
      color: rgb(var(--text-muted));
      font-size: 0.875rem;
    }
    .notif-card {
      background: rgb(var(--surface-2));
      border: 1px solid rgb(var(--border));
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: rgb(var(--text-secondary));
    }
    @media (max-width: 700px) {
      #cards-grid { grid-template-columns: 1fr !important; }
    }
  </style>

  <script>
    lucide.createIcons();

    document.getElementById('theme-toggle').addEventListener('click', () => { toggleTheme(); });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await API.post('/auth/logout'); } catch (_) {}
      window.location.href = '/index.html';
    });

    async function loadAccount() {
      try {
        const data = await API.get('/members/me');
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('account-content').style.display = 'block';

        document.getElementById('member-name').textContent = data.name;
        document.getElementById('member-email').textContent = data.email;
        document.getElementById('user-badge').innerHTML = `
          <i data-lucide="user-circle" style="width:18px;height:18px;"></i>
          <span>${data.name}</span>
        `;
        document.getElementById('stat-active-loans').textContent = data.activeLoansCount;
        document.getElementById('stat-pending-fines').textContent = formatCurrency(data.pendingFinesTotal);
        document.getElementById('stat-status').innerHTML = statusBadge(data.status);
        document.getElementById('status-badge-container').innerHTML = statusBadge(data.status);

        // Status banner
        const banner = document.getElementById('status-banner');
        if (data.status === 'on_hold') {
          banner.style.cssText = 'display:flex;border-radius:0.625rem;padding:0.875rem 1.125rem;margin-bottom:1.25rem;font-size:0.875rem;align-items:center;gap:0.625rem;background:rgba(var(--accent)/0.1);border:1px solid rgba(var(--accent)/0.3);color:rgb(var(--accent));';
          banner.innerHTML = '<i data-lucide="alert-triangle" style="width:16px;height:16px;flex-shrink:0;"></i><span>Your account is on hold due to outstanding fines. Please settle your balance to restore full access.</span>';
        } else if (data.status === 'suspended') {
          banner.style.cssText = 'display:flex;border-radius:0.625rem;padding:0.875rem 1.125rem;margin-bottom:1.25rem;font-size:0.875rem;align-items:center;gap:0.625rem;background:rgba(var(--danger)/0.1);border:1px solid rgba(var(--danger)/0.3);color:rgb(var(--danger));';
          banner.innerHTML = '<i data-lucide="x-circle" style="width:16px;height:16px;flex-shrink:0;"></i><span>Your account is suspended. Please contact library staff for assistance.</span>';
        } else if (data.status === 'active') {
          banner.style.cssText = 'display:flex;border-radius:0.625rem;padding:0.875rem 1.125rem;margin-bottom:1.25rem;font-size:0.875rem;align-items:center;gap:0.625rem;background:rgba(var(--success)/0.1);border:1px solid rgba(var(--success)/0.3);color:rgb(var(--success));';
          banner.innerHTML = '<i data-lucide="check-circle" style="width:16px;height:16px;flex-shrink:0;"></i><span>Your account is in good standing.</span>';
        }

        lucide.createIcons();

        // Current Loans list
        const activeLoans = (data.loans || []).filter(l => l.status !== 'returned');
        const loansList = document.getElementById('current-loans-list');
        if (activeLoans.length === 0) {
          loansList.innerHTML = '<div class="empty-card-msg">No active loans. Visit the library to borrow books!</div>';
        } else {
          loansList.innerHTML = activeLoans.map(l => {
            const days = daysUntilDue(l.due_date);
            let daysLabel;
            if (days < 0) daysLabel = `<span style="color:rgb(var(--danger));font-weight:600;font-size:0.75rem;">${Math.abs(days)}d overdue</span>`;
            else if (days === 0) daysLabel = `<span style="color:rgb(var(--accent));font-weight:600;font-size:0.75rem;">Due today</span>`;
            else daysLabel = `<span style="color:rgb(var(--text-muted));font-size:0.75rem;">${days}d left</span>`;
            return `<div class="loan-item">
              <div>
                <div style="font-weight:600;font-size:0.875rem;color:rgb(var(--text-primary));">${l.item_title}</div>
                <div style="font-size:0.75rem;color:rgb(var(--text-muted));">Due ${formatDate(l.due_date)}</div>
              </div>
              ${daysLabel}
            </div>`;
          }).join('');
        }

        // Outstanding Fines list
        const pendingFines = (data.fines || []).filter(f => f.status === 'pending');
        const finesList = document.getElementById('fines-list');
        const finesTotalEl = document.getElementById('fines-total');
        const payBtnRow = document.getElementById('pay-btn-row');
        if (pendingFines.length === 0) {
          finesList.innerHTML = '<div class="empty-card-msg">No outstanding fines.</div>';
          finesTotalEl.style.display = 'none';
          payBtnRow.style.display = 'none';
        } else {
          finesList.innerHTML = pendingFines.map(f => `
            <div class="fine-item">
              <div>
                <div style="font-weight:600;font-size:0.875rem;color:rgb(var(--text-primary));">${f.item_title || 'Fine'}</div>
                <div style="font-size:0.75rem;color:rgb(var(--text-muted));">${f.reason || 'Overdue fine'}</div>
              </div>
              <span style="font-weight:700;color:rgb(var(--danger));font-size:0.875rem;">${formatCurrency(f.amount)}</span>
            </div>
          `).join('');
          const total = pendingFines.reduce((s, f) => s + f.amount, 0);
          document.getElementById('fines-total-amount').textContent = formatCurrency(total);
          finesTotalEl.style.display = 'flex';
          payBtnRow.style.display = 'block';
        }

        // Loan History (returned)
        const returnedLoans = (data.loans || []).filter(l => l.status === 'returned');
        renderTable('loan-history-table', [
          { key: 'item_title', label: 'Book Title', render: (v, row) => `<div style="font-weight:600;">${v}</div><div style="font-size:0.75rem;color:rgb(var(--text-muted));">${row.item_author || ''}</div>` },
          { key: 'borrowed_date', label: 'Borrowed', render: v => formatDate(v) },
          { key: 'returned_date', label: 'Returned', render: v => v ? formatDate(v) : '—' },
          { key: 'status', label: 'Status', render: v => statusBadge(v) },
        ], returnedLoans, { emptyMessage: 'No past loans to show.' });

        // Notifications
        const notifList = document.getElementById('notifications-list');
        const notifs = data.notifications || [];
        if (notifs.length === 0) {
          notifList.innerHTML = '<div style="color:rgb(var(--text-muted));font-size:0.875rem;text-align:center;padding:1rem 0;">No notifications at this time.</div>';
        } else {
          notifList.innerHTML = notifs.map(n => `
            <div class="notif-card">
              <div style="font-size:0.8125rem;font-weight:600;color:rgb(var(--text-primary));margin-bottom:0.2rem;">${n.subject || 'Notification'}</div>
              <div>${n.message || ''}</div>
              <div style="font-size:0.75rem;color:rgb(var(--text-muted));margin-top:0.375rem;">${formatDate(n.sent_at || n.created_at)}</div>
            </div>
          `).join('');
        }

        lucide.createIcons();
      } catch (err) {
        window.location.href = '/member/login.html';
      }
    }

    loadAccount();
  </script>
</body>
</html>
