<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CloudFolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: 208 138 46;
      --danger: 196 60 74;
      --left-bg: #eef2f7;
      --right-bg: #f8fafc;
      --border-subtle: rgba(0 0 0 / 0.08);
      --input-bg: rgba(0 0 0 / 0.04);
      --input-border: rgba(0 0 0 / 0.12);
      --input-border-focus: rgba(208 138 46 / 0.5);
      --text: #0f172a;
      --text-muted: rgba(15 23 42 / 0.5);
      --text-sub: rgba(15 23 42 / 0.35);
      --heading: #0f172a;
      --label: rgba(15 23 42 / 0.65);
    }
    html.dark {
      --left-bg: #0a1220;
      --right-bg: #0d1728;
      --border-subtle: rgba(255 255 255 / 0.05);
      --input-bg: rgba(255 255 255 / 0.05);
      --input-border: rgba(255 255 255 / 0.1);
      --text: #e8eef7;
      --text-muted: rgba(232 238 247 / 0.45);
      --text-sub: rgba(232 238 247 / 0.3);
      --heading: #ffffff;
      --label: rgba(232 238 247 / 0.75);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      background: var(--right-bg);
      color: var(--text);
    }

    /* ── Left panel ── */
    .auth-left {
      width: 50%;
      background: var(--left-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border-subtle);
    }
    @media (max-width: 768px) { .auth-left { display: none; } }

    .auth-left::before {
      content: '';
      position: absolute;
      width: 450px; height: 450px;
      border-radius: 50%;
      background: rgba(22 138 99 / 0.07);
      top: -120px; right: -120px;
      filter: blur(80px);
      pointer-events: none;
    }
    .auth-left::after {
      content: '';
      position: absolute;
      width: 350px; height: 350px;
      border-radius: 50%;
      background: rgba(208 138 46 / 0.06);
      bottom: -100px; left: -80px;
      filter: blur(70px);
      pointer-events: none;
    }

    .left-content { position: relative; text-align: center; max-width: 320px; }

    .left-icon { margin-bottom: 2rem; color: rgb(var(--accent)); opacity: 0.75; }

    .left-title {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 0.875rem;
      line-height: 1.15;
    }

    .left-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.7; }

    /* ── Right panel ── */
    .auth-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-y: auto;
    }

    .theme-btn {
      position: fixed;
      top: 1.125rem; right: 1.125rem;
      width: 36px; height: 36px;
      background: rgba(0 0 0 / 0.06);
      border: 1px solid rgba(0 0 0 / 0.1);
      border-radius: 0.5rem;
      color: rgba(15 23 42 / 0.5);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
      z-index: 50;
    }
    .theme-btn:hover { background: rgba(0 0 0 / 0.1); color: rgba(15 23 42 / 0.9); }
    html.dark .theme-btn { background: rgba(255 255 255 / 0.06); border-color: rgba(255 255 255 / 0.1); color: rgba(232 238 247 / 0.5); }
    html.dark .theme-btn:hover { background: rgba(255 255 255 / 0.1); color: rgba(232 238 247 / 0.9); }

    .form-card { width: 100%; max-width: 400px; padding: 1.5rem 0; }

    .brand {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 1.75rem;
      display: block;
      text-decoration: none;
    }
    .brand span { color: rgb(var(--accent)); }

    .form-heading { font-family: 'Crimson Pro', Georgia, serif; font-size: 1.625rem; font-weight: 700; color: var(--heading); margin-bottom: 0.25rem; }
    .form-sub { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.75rem; }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.8125rem; font-weight: 500; color: var(--label); margin-bottom: 0.5rem; }

    .field input {
      width: 100%;
      padding: 0.6875rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 0.625rem;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: var(--text-sub); }
    .field input:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px rgba(208 138 46 / 0.12); }
    .field input.error { border-color: rgba(196 60 74 / 0.6); }

    .field-row { position: relative; }
    .field-row input { padding-right: 2.75rem; }
    .pw-toggle {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); display: flex; align-items: center; padding: 0.25rem;
      transition: color 0.15s;
    }
    .pw-toggle:hover { color: var(--text); }

    .field-error { font-size: 0.75rem; color: rgb(var(--danger)); margin-top: 0.375rem; }

    .alert-error {
      background: rgba(196 60 74 / 0.1);
      border: 1px solid rgba(196 60 74 / 0.25);
      border-radius: 0.625rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: rgb(var(--danger));
      margin-bottom: 1.125rem;
      display: none;
    }

    .btn-submit {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: rgb(var(--accent));
      border: none;
      border-radius: 0.625rem;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255 255 255 / 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottom-link { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
    .bottom-link a { color: rgb(var(--accent)); font-weight: 600; text-decoration: none; }
    .bottom-link a:hover { text-decoration: underline; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeUp 0.45s ease forwards; }

    #toast-container { position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 200; display: flex; flex-direction: column; gap: 0.625rem; }
    .theme-sun { display: none; line-height: 0; }
    .theme-moon { display: inline-flex; line-height: 0; }
    html.dark .theme-sun { display: inline-flex; }
    html.dark .theme-moon { display: none; }
  </style>
</head>
<body>

  <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
    <span class="theme-sun"><i data-lucide="sun" style="width:16px;height:16px;"></i></span>
    <span class="theme-moon"><i data-lucide="moon" style="width:16px;height:16px;"></i></span>
  </button>

  <!-- Left decorative panel -->
  <div class="auth-left">
    <div class="left-content">
      <div class="left-icon">
        <i data-lucide="user-plus" style="width:72px;height:72px;stroke-width:1.25;"></i>
      </div>
      <h1 class="left-title">Join CloudFolio</h1>
      <p class="left-desc">Create your library account to borrow items, track your reading, and stay connected.</p>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="auth-right">
    <div class="form-card fade-in">

      <a href="/index.html" class="brand">Cloud<span>Folio</span></a>

      <h2 class="form-heading">Create Account</h2>
      <p class="form-sub">Sign up for a library membership</p>

      <div class="alert-error" id="error-alert"></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Jane Doe" autocomplete="name" required>
          <div class="field-error" id="name-error"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          <div class="field-error" id="email-error"></div>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" placeholder="(555) 123-4567" autocomplete="tel">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field-row">
            <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" id="toggle-pw" aria-label="Toggle password">
              <i data-lucide="eye" style="width:15px;height:15px;"></i>
            </button>
          </div>
          <div class="field-error" id="password-error"></div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm your password" autocomplete="new-password" required>
          <div class="field-error" id="confirm-password-error"></div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Create Account</button>
      </form>

      <p class="bottom-link">Already have an account? <a href="/member/login.html">Sign in</a></p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    lucide.createIcons();

    document.getElementById('theme-toggle').addEventListener('click', () => { toggleTheme(); });

    let pwVisible = false;
    document.getElementById('toggle-pw').addEventListener('click', function() {
      pwVisible = !pwVisible;
      document.getElementById('password').type = pwVisible ? 'text' : 'password';
      this.innerHTML = `<i data-lucide="${pwVisible ? 'eye-off' : 'eye'}" style="width:15px;height:15px;"></i>`;
      lucide.createIcons({ nodes: [this] });
    });

    const FIELDS = ['name', 'email', 'password', 'confirm-password'];

    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const errorAlert = document.getElementById('error-alert');
      const submitBtn = document.getElementById('submit-btn');

      errorAlert.style.display = 'none';
      FIELDS.forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.classList.remove('error'); }
        const err = document.getElementById(id + '-error');
        if (err) err.textContent = '';
      });

      let valid = true;
      if (!name) { set('name', 'Full name is required.'); valid = false; }
      if (!email) { set('email', 'Email is required.'); valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { set('email', 'Enter a valid email address.'); valid = false; }
      if (!password) { set('password', 'Password is required.'); valid = false; }
      else if (password.length < 6) { set('password', 'Password must be at least 6 characters.'); valid = false; }
      if (!confirm) { set('confirm-password', 'Please confirm your password.'); valid = false; }
      else if (password !== confirm) { set('confirm-password', 'Passwords do not match.'); valid = false; }
      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating Account…';

      try {
        const result = await API.post('/auth/member/signup', { name, email, phone: phone || null, password });
        showToast('Account created! Welcome, ' + result.name + '!', 'success');
        setTimeout(() => window.location.href = '/member/account.html', 600);
      } catch (err) {
        errorAlert.textContent = err.message || 'Failed to create account.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account';
      }
    });

    function set(id, msg) {
      const el = document.getElementById(id);
      const err = document.getElementById(id + '-error');
      if (el) el.classList.add('error');
      if (err) err.textContent = msg;
    }

    FIELDS.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', function() {
        this.classList.remove('error');
        const err = document.getElementById(id + '-error');
        if (err) err.textContent = '';
        document.getElementById('error-alert').style.display = 'none';
      });
    });
  </script>
</body>
</html>
