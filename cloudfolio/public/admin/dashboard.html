<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CloudFolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body data-page-title="Admin Dashboard">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="page-body fade-in">

      <!-- Stat Cards (6) -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--info)/0.12);">
            <i data-lucide="book-open" style="width:22px;height:22px;color:rgb(var(--info));"></i>
          </div>
          <div><div class="stat-label">Active Loans</div><div class="stat-value" id="stat-active">—</div><div class="stat-sub">Active + Due Today</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--danger)/0.12);">
            <i data-lucide="alert-circle" style="width:22px;height:22px;color:rgb(var(--danger));"></i>
          </div>
          <div><div class="stat-label">Overdue</div><div class="stat-value" id="stat-overdue">—</div><div class="stat-sub">Items past due date</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--accent)/0.12);">
            <i data-lucide="banknote" style="width:22px;height:22px;color:rgb(var(--accent));"></i>
          </div>
          <div><div class="stat-label">Pending Fines</div><div class="stat-value" id="stat-fines">—</div><div class="stat-sub">Total outstanding</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--success)/0.12);">
            <i data-lucide="users" style="width:22px;height:22px;color:rgb(var(--success));"></i>
          </div>
          <div><div class="stat-label">Active Members</div><div class="stat-value" id="stat-members">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--accent)/0.15);">
            <i data-lucide="shield-check" style="width:22px;height:22px;color:rgb(var(--accent));"></i>
          </div>
          <div><div class="stat-label">Staff Accounts</div><div class="stat-value" id="stat-staff">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--danger)/0.12);">
            <i data-lucide="shield-alert" style="width:22px;height:22px;color:rgb(var(--danger));"></i>
          </div>
          <div><div class="stat-label">System Alerts</div><div class="stat-value" id="stat-alerts">—</div><div class="stat-sub">Overdue + Suspended</div></div>
        </div>
      </div>

      <!-- Overdue table + Quick Actions -->
      <div style="display:grid;grid-template-columns:1fr 300px;gap:1.25rem;margin-bottom:1.25rem;" class="responsive-grid">
        <div class="card">
          <div class="card-header">
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <i data-lucide="alert-circle" style="width:15px;height:15px;color:rgb(var(--danger));"></i>
              <span class="card-title">Recent Overdue</span>
            </div>
            <a href="/admin/overdue.html" style="font-size:0.8125rem;color:rgb(var(--info));font-weight:600;">View All</a>
          </div>
          <div id="overdue-table"></div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">Quick Actions</span></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:0.625rem;">
            <button id="btn-new-loan" class="btn btn-primary" style="justify-content:flex-start;gap:0.5rem;">
              <i data-lucide="plus-circle" style="width:16px;height:16px;"></i> New Loan
            </button>
            <a href="/admin/staff.html" class="btn btn-secondary" style="justify-content:flex-start;gap:0.5rem;">
              <i data-lucide="user-plus" style="width:16px;height:16px;"></i> Add Staff Account
            </a>
            <a href="/admin/settings.html" class="btn btn-ghost" style="justify-content:flex-start;gap:0.5rem;">
              <i data-lucide="settings" style="width:16px;height:16px;"></i> System Settings
            </a>
            <a href="/admin/logs.html" class="btn btn-ghost" style="justify-content:flex-start;gap:0.5rem;">
              <i data-lucide="scroll-text" style="width:16px;height:16px;"></i> Activity Logs
            </a>
          </div>
        </div>
      </div>

      <!-- Activity Feed -->
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <i data-lucide="scroll-text" style="width:15px;height:15px;color:rgb(var(--text-muted));"></i>
            <span class="card-title">Recent Activity</span>
          </div>
          <a href="/admin/logs.html" style="font-size:0.8125rem;color:rgb(var(--info));font-weight:600;">View All</a>
        </div>
        <div class="card-body" style="padding:0;" id="activity-feed"></div>
      </div>
    </div>
  </div>

  <script>window.PAGE_TITLE = 'Admin Dashboard';</script>
  <script src="/js/admin-layout.js"></script>
  <script>
    lucide.createIcons();

    const ACTION_EMOJI = {
      'CREATE_LOAN': '📖', 'CREATE_FINE': '💰', 'RETURN_BOOK': '✅',
      'LOGIN': '🔑', 'UPDATE_SETTINGS': '⚙️', 'CREATE_STAFF': '👤',
      'SEND_NOTIFICATION': '📩', 'SUSPEND_MEMBER': '🚫', 'CREATE_MEMBER': '🙋',
      'MARK_OVERDUE': '⏰', 'ACTIVATE_MEMBER': '✔️', 'WAIVE_FINE': '🤝'
    };

    function roleColor(role) {
      if (role === 'admin') return 'color:rgb(var(--accent));font-weight:600;';
      if (role === 'staff') return 'color:rgb(var(--info));font-weight:600;';
      return 'color:rgb(var(--text-muted));';
    }

    let allLoans = [];
    let allMembers = [];

    async function loadDashboard() {
      try {
        const [loans, members, fines, staff, logs] = await Promise.all([
          API.get('/loans'),
          API.get('/members'),
          API.get('/fines'),
          API.get('/staff'),
          API.get('/logs?limit=10')
        ]);

        allLoans = loans;
        allMembers = members;

        const activeLoans = loans.filter(l => ['active','due_today'].includes(l.status));
        const overdueLoans = loans.filter(l => l.status === 'overdue');
        const pendingFines = fines.filter(f => f.status === 'pending').reduce((s,f)=>s+f.amount,0);
        const activeMembers = members.filter(m => m.status === 'active');
        const activeStaff = staff.filter(s => s.status === 'active');
        const suspendedMembers = members.filter(m => m.status === 'suspended').length;
        const alerts = overdueLoans.length + suspendedMembers;

        document.getElementById('stat-active').textContent = activeLoans.length;
        document.getElementById('stat-overdue').textContent = overdueLoans.length;
        document.getElementById('stat-fines').textContent = formatCurrency(pendingFines);
        document.getElementById('stat-members').textContent = activeMembers.length;
        document.getElementById('stat-staff').textContent = activeStaff.length;
        document.getElementById('stat-alerts').textContent = alerts;

        renderTable('overdue-table', [
          { key: 'member_name', label: 'Member', render: v => `<span style="font-weight:600;">${v}</span>` },
          { key: 'item_title', label: 'Item', render: v => `<span style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;">${v}</span>` },
          { key: 'due_date', label: 'Days Overdue', render: v => `<span style="color:rgb(var(--danger));font-weight:600;">${daysOverdue(v)}d</span>` },
        ], overdueLoans.slice(0, 8), { emptyMessage: 'No overdue loans!' });

        // Activity feed with emoji + role colors
        const feed = document.getElementById('activity-feed');
        if (!logs || logs.length === 0) {
          feed.innerHTML = '<div style="padding:1.5rem;text-align:center;color:rgb(var(--text-muted));font-size:0.875rem;">No recent activity.</div>';
        } else {
          feed.innerHTML = logs.slice(0, 10).map((log, i, arr) => {
            const emoji = ACTION_EMOJI[log.action] || '📋';
            const nameStyle = roleColor(log.user_role);
            return `<div style="padding:0.75rem 1rem;display:flex;align-items:flex-start;gap:0.75rem;${i < arr.length - 1 ? 'border-bottom:1px solid rgb(var(--border));' : ''}">
              <span style="font-size:1.1rem;line-height:1.4;flex-shrink:0;">${emoji}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:0.8125rem;color:rgb(var(--text-primary));">${log.details || log.action}</div>
                <div style="display:flex;align-items:center;gap:0.375rem;margin-top:0.2rem;">
                  <span style="font-size:0.75rem;${nameStyle}">${log.user_name || 'System'}</span>
                  <span style="font-size:0.75rem;color:rgb(var(--text-muted));">· ${timeAgo(log.created_at)}</span>
                </div>
              </div>
            </div>`;
          }).join('');
        }

        lucide.createIcons();
      } catch (err) {
        showToast('Failed to load dashboard.', 'error');
      }
    }

    document.getElementById('btn-new-loan').addEventListener('click', async () => {
      let members = allMembers;
      if (!members.length) members = await API.get('/members');
      const active = members.filter(m => m.status === 'active');
      const today = new Date();
      const defaultDue = new Date(today);
      defaultDue.setDate(defaultDue.getDate() + 14);
      const defaultDueStr = defaultDue.toISOString().split('T')[0];
      const opts = active.map(m => `<option value="${m.id}">${m.name} (${m.email})</option>`).join('');

      openModal('New Loan', `
        <form id="new-loan-form">
          <div class="form-group">
            <label class="form-label">Member *</label>
            <select id="loan-member" class="form-control" required>
              <option value="">Select a member...</option>${opts}
            </select>
            <div class="form-error" id="loan-member-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Item Title *</label>
            <input type="text" id="loan-title" class="form-control" placeholder="e.g., Noli Me Tangere" required>
            <div class="form-error" id="loan-title-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Author</label>
            <input type="text" id="loan-author" class="form-control" placeholder="Author name">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <div class="form-group">
              <label class="form-label">Type</label>
              <select id="loan-type" class="form-control">
                <option value="book">Book</option>
                <option value="magazine">Magazine</option>
                <option value="dvd">DVD</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Call No.</label>
              <input type="text" id="loan-callno" class="form-control" placeholder="e.g., FIC-001">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Due Date *</label>
            <input type="date" id="loan-due" class="form-control" value="${defaultDueStr}" required>
            <div class="form-error" id="loan-due-error"></div>
          </div>
        </form>
      `, {
        confirmText: 'Create Loan',
        onConfirm: async () => {
          const memberId = document.getElementById('loan-member').value;
          const title = document.getElementById('loan-title').value.trim();
          const author = document.getElementById('loan-author').value.trim();
          const type = document.getElementById('loan-type').value;
          const callNo = document.getElementById('loan-callno').value.trim();
          const dueDate = document.getElementById('loan-due').value;

          if (!memberId) { document.getElementById('loan-member-error').textContent = 'Select a member.'; return; }
          if (!title) { document.getElementById('loan-title-error').textContent = 'Title is required.'; return; }
          if (!dueDate) { document.getElementById('loan-due-error').textContent = 'Due date is required.'; return; }

          const btn = document.getElementById('modal-confirm-btn');
          btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating...';
          try {
            await API.post('/loans', { member_id: parseInt(memberId), item_title: title, item_author: author || null, item_type: type, item_call_no: callNo || null, due_date: dueDate });
            showToast('Loan created!', 'success');
            closeModal();
            loadDashboard();
          } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false; btn.innerHTML = 'Create Loan';
          }
        }
      });
      lucide.createIcons();
    });

    loadDashboard();
  </script>
  <style>
    @media (max-width: 900px) { .responsive-grid { grid-template-columns: 1fr !important; } }
  </style>
</body>
</html>
