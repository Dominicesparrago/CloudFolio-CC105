<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fines — CloudFolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body data-page-title="Fines & Payments">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="page-body fade-in">
      <!-- Period Filter -->
      <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.875rem;flex-wrap:wrap;">
        <span style="font-size:0.8125rem;color:rgb(var(--text-muted));font-weight:500;">Period:</span>
        <div id="period-pills" style="display:flex;gap:0.375rem;flex-wrap:wrap;">
          <button class="period-pill" data-period="today">Today</button>
          <button class="period-pill" data-period="week">This Week</button>
          <button class="period-pill" data-period="month">This Month</button>
          <button class="period-pill period-pill-active" data-period="all">All Time</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.25rem;">
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--danger)/0.12);">
            <i data-lucide="alert-triangle" style="width:20px;height:20px;color:rgb(var(--danger));"></i>
          </div>
          <div><div class="stat-label">Total Pending</div><div class="stat-value" id="stat-pending">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(var(--success)/0.12);">
            <i data-lucide="check-circle" style="width:20px;height:20px;color:rgb(var(--success));"></i>
          </div>
          <div><div class="stat-label">Total Collected</div><div class="stat-value" id="stat-collected">—</div></div>
        </div>
      </div>

      <style>
        .period-pill {
          padding: 0.3125rem 0.75rem;
          border-radius: 9999px;
          border: 1.5px solid rgb(var(--border));
          font-size: 0.8125rem;
          font-weight: 500;
          cursor: pointer;
          background: transparent;
          color: rgb(var(--text-muted));
          transition: all 0.15s;
        }
        .period-pill:hover { border-color: rgb(var(--accent)); color: rgb(var(--accent)); }
        .period-pill-active { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: #fff !important; }
      </style>
      <div class="card">
        <div class="card-header"><span class="card-title">Fines & Payments</span></div>
        <div class="filter-bar">
          <select id="filter-status" class="form-control" style="max-width:160px;">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="waived">Waived</option>
          </select>
          <input type="text" id="search-input" class="form-control" placeholder="Search member..." style="max-width:260px;">
          <button id="btn-clear" class="btn btn-ghost btn-sm">Clear</button>
        </div>
        <div id="fines-table"></div>
      </div>
    </div>
  </div>

  <script>window.PAGE_TITLE = 'Fines & Payments';</script>
  <script src="/js/admin-layout.js"></script>
  <script>
    lucide.createIcons();

    let allFines = [];
    let tableCtrl = null;
    let activePeriod = 'all';

    function inPeriod(dateStr, period) {
      if (!dateStr || period === 'all') return true;
      const d = new Date(dateStr.replace(' ', 'T'));
      if (isNaN(d)) return true;
      const today = new Date(); today.setHours(0,0,0,0);
      if (period === 'today') {
        return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
      }
      if (period === 'week') {
        const start = new Date(today); start.setDate(today.getDate() - today.getDay());
        const end = new Date(start); end.setDate(start.getDate() + 6); end.setHours(23,59,59,999);
        return d >= start && d <= end;
      }
      if (period === 'month') {
        return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth();
      }
      return true;
    }

    function updateStats() {
      const pending = allFines.filter(f => f.status === 'pending' && inPeriod(f.created_at, activePeriod)).reduce((s,f) => s+f.amount, 0);
      const collected = allFines.filter(f => f.status === 'paid' && inPeriod(f.paid_date || f.created_at, activePeriod)).reduce((s,f) => s+f.amount, 0);
      document.getElementById('stat-pending').textContent = formatCurrency(pending);
      document.getElementById('stat-collected').textContent = formatCurrency(collected);
    }

    function applyFilters() {
      const status = document.getElementById('filter-status').value;
      const search = document.getElementById('search-input').value.toLowerCase();
      const filtered = allFines.filter(f => {
        const matchStatus = !status || f.status === status;
        const matchSearch = !search || (f.member_name && f.member_name.toLowerCase().includes(search));
        const refDate = f.status === 'paid' ? (f.paid_date || f.created_at) : f.created_at;
        const matchPeriod = inPeriod(refDate, activePeriod);
        return matchStatus && matchSearch && matchPeriod;
      });
      if (tableCtrl) tableCtrl.update(filtered);
    }

    document.getElementById('period-pills').addEventListener('click', e => {
      const pill = e.target.closest('.period-pill');
      if (!pill) return;
      document.querySelectorAll('.period-pill').forEach(p => p.classList.remove('period-pill-active'));
      pill.classList.add('period-pill-active');
      activePeriod = pill.dataset.period;
      updateStats();
      applyFilters();
    });

    async function loadFines() {
      try {
        allFines = await API.get('/fines');
        updateStats();

        tableCtrl = renderTable('fines-table', [
          { key: 'member_name', label: 'Member', render: v => `<span style="font-weight:600;">${v}</span>` },
          { key: 'item_title', label: 'Item', render: v => v || '—' },
          { key: 'reason', label: 'Reason', render: v => `<span style="font-size:0.8125rem;">${v || '—'}</span>` },
          { key: 'amount', label: 'Amount (₱)', render: v => `<span style="font-weight:600;font-family:'Courier Prime',monospace;">${formatCurrency(v)}</span>` },
          { key: 'status', label: 'Status', render: v => statusBadge(v) },
          { key: 'created_at', label: 'Date', render: v => formatDate(v) },
          { key: 'id', label: 'Actions', sortable: false, render: (v, row) => {
            if (row.status !== 'pending') return '<span style="color:rgb(var(--text-subtle));font-size:0.8125rem;">—</span>';
            return `<div style="display:flex;gap:0.375rem;">
              <button class="btn btn-sm btn-success action-paid" data-id="${v}">Mark Paid</button>
              <button class="btn btn-sm btn-ghost action-waive" data-id="${v}" style="color:rgb(var(--text-muted));">Waive</button>
            </div>`;
          }}
        ], allFines, { emptyMessage: 'No fines found.' });

        document.getElementById('fines-table').addEventListener('click', async e => {
          const paidBtn = e.target.closest('.action-paid');
          const waiveBtn = e.target.closest('.action-waive');
          if (paidBtn) {
            e.stopPropagation();
            if (!confirm('Mark as paid?')) return;
            paidBtn.disabled = true; paidBtn.textContent = '...';
            try { await API.put('/fines/' + paidBtn.dataset.id, { status: 'paid' }); showToast('Fine marked as paid!', 'success'); await loadFines(); applyFilters(); }
            catch (err) { showToast(err.message, 'error'); paidBtn.disabled = false; paidBtn.textContent = 'Mark Paid'; }
          }
          if (waiveBtn) {
            e.stopPropagation();
            if (!confirm('Waive this fine?')) return;
            waiveBtn.disabled = true;
            try { await API.put('/fines/' + waiveBtn.dataset.id, { status: 'waived' }); showToast('Fine waived.', 'success'); await loadFines(); applyFilters(); }
            catch (err) { showToast(err.message, 'error'); waiveBtn.disabled = false; }
          }
        });

        lucide.createIcons();
      } catch (err) { showToast('Failed to load fines.', 'error'); }
    }

    document.getElementById('filter-status').addEventListener('change', applyFilters);
    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('btn-clear').addEventListener('click', () => { document.getElementById('filter-status').value=''; document.getElementById('search-input').value=''; applyFilters(); });

    loadFines();
  </script>
</body>
</html>
