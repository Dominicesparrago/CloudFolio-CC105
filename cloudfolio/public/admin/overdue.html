<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overdue Queue — CloudFolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body data-page-title="Overdue Queue">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="page-body fade-in">
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <i data-lucide="alert-circle" style="width:16px;height:16px;color:rgb(var(--danger));"></i>
            <span class="card-title">Overdue Queue</span>
            <span id="overdue-count" class="badge badge-overdue" style="margin-left:0.25rem;"></span>
          </div>
          <button id="btn-bulk-notify" class="btn btn-sm" disabled title="SMS dispatch unavailable — Semaphore subscription pending" style="gap:0.375rem;opacity:0.55;cursor:not-allowed;background:rgba(208,138,46,0.12);color:rgb(208,138,46);border:1px solid rgba(208,138,46,0.3);">
            <i data-lucide="clock" style="width:14px;height:14px;"></i>
            SMS — Coming Soon
          </button>
        </div>
        <div id="overdue-table"></div>
      </div>
    </div>
  </div>

  <script>window.PAGE_TITLE = 'Overdue Queue';</script>
  <script src="/js/admin-layout.js"></script>
  <script>
    lucide.createIcons();

    let allOverdue = [];
    let tableCtrl = null;
    let fineRate = 10.00;
    let fineCap = 200.00;
    let suspendedSet = new Set();

    function getAdjustedFineDays(dueDateStr) {
      const due = new Date(dueDateStr + 'T00:00:00');
      const now = new Date(); now.setHours(0,0,0,0);
      if (now <= due) return 0;
      let days = 0;
      const cur = new Date(due);
      cur.setDate(cur.getDate() + 1);
      while (cur <= now) {
        const d = cur.toISOString().split('T')[0];
        if (!suspendedSet.has(d)) days++;
        cur.setDate(cur.getDate() + 1);
      }
      return days;
    }

    function getAdjustedFine(dueDateStr) {
      return Math.min(getAdjustedFineDays(dueDateStr) * fineRate, fineCap);
    }

    async function loadOverdue() {
      try {
        const [overdueData, settings] = await Promise.all([
          API.get('/loans/overdue'),
          API.get('/settings').catch(() => null)
        ]);

        allOverdue = overdueData;

        if (settings && settings.settings) {
          fineRate = parseFloat(settings.settings.fine_per_day) || 10.00;
          fineCap = parseFloat(settings.settings.fine_cap) || 200.00;
        }

        try {
          const suspendedData = await API.get('/calendar');
          suspendedSet = new Set(suspendedData.map(d => d.date));
        } catch (_) {
          suspendedSet = new Set();
        }

        document.getElementById('overdue-count').textContent = allOverdue.length;

        tableCtrl = renderTable('overdue-table', [
          { key: 'member_name', label: 'Member', render: v => `<span style="font-weight:600;">${v}</span>` },
          { key: 'item_title', label: 'Item', render: (v, row) => `<div style="max-width:200px;"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v}</div><div style="font-size:0.75rem;color:rgb(var(--text-muted));">${row.item_author||''}</div></div>` },
          { key: 'due_date', label: 'Due Date', render: v => `<span style="color:rgb(var(--danger));">${formatDate(v)}</span>` },
          { key: 'due_date', label: 'Days Overdue', render: v => {
            const raw = daysOverdue(v); const adj = getAdjustedFineDays(v); const diff = raw - adj;
            return `<span style="color:rgb(var(--danger));font-weight:700;">${raw} day${raw!==1?'s':''}</span>`
              + (diff > 0 ? ` <span style="font-size:0.7rem;color:rgb(var(--text-muted));">(${diff} suspended)</span>` : '');
          }},
          { key: 'due_date', label: 'Fine Accrued', sortable: false, render: v => {
            const fine = getAdjustedFine(v);
            const isCapped = getAdjustedFineDays(v) * fineRate >= fineCap;
            return `<span style="font-weight:600;color:rgb(var(--accent));">${formatCurrency(fine)}</span>${isCapped ? ' <span style="font-size:0.7rem;background:rgba(var(--accent)/0.15);color:rgb(var(--accent));padding:1px 5px;border-radius:4px;font-weight:600;">Cap</span>' : ''}`;
          }},
          { key: 'status', label: 'Status', render: v => statusBadge(v) },
          { key: 'id', label: 'Actions', sortable: false, render: (v, row) => `
            <div style="display:flex;gap:0.375rem;flex-wrap:wrap;">
              <span title="SMS unavailable — Coming Soon" style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.5rem;border-radius:0.375rem;font-size:0.75rem;font-weight:600;background:rgba(208,138,46,0.1);color:rgb(208,138,46);border:1px solid rgba(208,138,46,0.2);cursor:default;">
                <i data-lucide="clock" style="width:11px;height:11px;"></i> SMS Soon
              </span>
              <button class="btn btn-sm btn-success action-return" data-id="${v}">Return</button>
            </div>
          `}
        ], allOverdue, { selectable: true, emptyMessage: 'No overdue loans!' });

        lucide.createIcons();

        document.getElementById('overdue-table').addEventListener('click', async e => {
          const notifyBtn = e.target.closest('.action-notify');
          const returnBtn = e.target.closest('.action-return');
          if (returnBtn) {
            e.stopPropagation();
            if (!confirm('Confirm return?')) return;
            returnBtn.disabled = true;
            try {
              await API.put('/loans/' + returnBtn.dataset.id, { action: 'return' });
              showToast('Book returned!', 'success');
              loadOverdue();
            } catch (err) { showToast(err.message, 'error'); returnBtn.disabled = false; }
          }
          updateBulkBtn();
        });

        document.getElementById('overdue-table').addEventListener('change', updateBulkBtn);
      } catch (err) { showToast('Failed to load overdue loans.', 'error'); }
    }


    loadOverdue();
  </script>
</body>
</html>
