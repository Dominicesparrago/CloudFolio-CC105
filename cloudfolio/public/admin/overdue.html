<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overdue Queue — CloudFolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body data-page-title="Overdue Queue">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="page-body fade-in">
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <i data-lucide="alert-circle" style="width:16px;height:16px;color:rgb(var(--danger));"></i>
            <span class="card-title">Overdue Queue</span>
            <span id="overdue-count" class="badge badge-overdue" style="margin-left:0.25rem;"></span>
          </div>
          <button id="btn-bulk-notify" class="btn btn-primary btn-sm" style="gap:0.375rem;" disabled>
            <i data-lucide="bell" style="width:14px;height:14px;"></i>
            Send Overdue Notices
          </button>
        </div>
        <div id="overdue-table"></div>
      </div>
    </div>
  </div>

  <script>window.PAGE_TITLE = 'Overdue Queue';</script>
  <script src="/js/admin-layout.js"></script>
  <script>
    lucide.createIcons();

    let allOverdue = [];
    let tableCtrl = null;

    async function loadOverdue() {
      try {
        allOverdue = await API.get('/loans/overdue');
        document.getElementById('overdue-count').textContent = allOverdue.length;

        tableCtrl = renderTable('overdue-table', [
          { key: 'member_name', label: 'Member', render: v => `<span style="font-weight:600;">${v}</span>` },
          { key: 'item_title', label: 'Item', render: (v, row) => `<div style="max-width:200px;"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v}</div><div style="font-size:0.75rem;color:rgb(var(--text-muted));">${row.item_author||''}</div></div>` },
          { key: 'due_date', label: 'Due Date', render: v => `<span style="color:rgb(var(--danger));">${formatDate(v)}</span>` },
          { key: 'due_date', label: 'Days Overdue', render: v => { const d=daysOverdue(v); return `<span style="color:rgb(var(--danger));font-weight:700;">${d} day${d!==1?'s':''}</span>`; }},
          { key: 'due_date', label: 'Fine Accrued', sortable: false, render: v => `<span style="font-weight:600;color:rgb(var(--accent));">${formatCurrency(daysOverdue(v)*10)}</span>` },
          { key: 'status', label: 'Status', render: v => statusBadge(v) },
          { key: 'id', label: 'Actions', sortable: false, render: (v, row) => `
            <div style="display:flex;gap:0.375rem;flex-wrap:wrap;">
              <button class="btn btn-sm btn-ghost action-notify" data-id="${v}" data-member-id="${row.member_id}" data-title="${row.item_title.replace(/"/g,'&quot;')}" style="color:rgb(var(--info));">
                <i data-lucide="bell" style="width:12px;height:12px;"></i> Notice
              </button>
              <button class="btn btn-sm btn-success action-return" data-id="${v}">Return</button>
            </div>
          `}
        ], allOverdue, { selectable: true, emptyMessage: 'No overdue loans!' });

        lucide.createIcons();

        document.getElementById('overdue-table').addEventListener('click', async e => {
          const notifyBtn = e.target.closest('.action-notify');
          const returnBtn = e.target.closest('.action-return');
          if (notifyBtn) {
            e.stopPropagation();
            notifyBtn.disabled = true;
            try {
              await API.post('/notifications', { member_id: parseInt(notifyBtn.dataset.memberId), title: 'Overdue Notice', message: `Your loan of "${notifyBtn.dataset.title}" is overdue. Please return immediately.`, type: 'overdue' });
              showToast('Notice created!', 'success');
            } catch (err) { showToast(err.message, 'error'); }
            notifyBtn.disabled = false;
          }
          if (returnBtn) {
            e.stopPropagation();
            if (!confirm('Confirm return?')) return;
            returnBtn.disabled = true;
            try {
              await API.put('/loans/' + returnBtn.dataset.id, { action: 'return' });
              showToast('Book returned!', 'success');
              loadOverdue();
            } catch (err) { showToast(err.message, 'error'); returnBtn.disabled = false; }
          }
          updateBulkBtn();
        });

        document.getElementById('overdue-table').addEventListener('change', updateBulkBtn);
      } catch (err) { showToast('Failed to load overdue loans.', 'error'); }
    }

    function updateBulkBtn() {
      const selected = tableCtrl ? tableCtrl.getSelected() : [];
      const btn = document.getElementById('btn-bulk-notify');
      btn.disabled = selected.length === 0;
      btn.innerHTML = selected.length > 0 ? `<i data-lucide="bell" style="width:14px;height:14px;"></i> Send Notices (${selected.length})` : '<i data-lucide="bell" style="width:14px;height:14px;"></i> Send Overdue Notices';
      lucide.createIcons({ nodes: [btn] });
    }

    document.getElementById('btn-bulk-notify').addEventListener('click', async () => {
      const selected = tableCtrl ? tableCtrl.getSelected() : [];
      if (!selected.length) return;
      const btn = document.getElementById('btn-bulk-notify');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';
      let sent = 0;
      for (const loan of selected) {
        try {
          await API.post('/notifications', { member_id: loan.member_id, title: 'Overdue Notice', message: `Your loan of "${loan.item_title}" is overdue.`, type: 'overdue' });
          sent++;
        } catch (_) {}
      }
      showToast(`${sent} notice${sent!==1?'s':''} created!`, 'success');
      updateBulkBtn();
    });

    loadOverdue();
  </script>
</body>
</html>
