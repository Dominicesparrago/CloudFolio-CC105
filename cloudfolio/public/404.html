<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found — CloudFolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgb(var(--bg));padding:2rem;">
  <div class="fade-in" style="text-align:center;max-width:480px;">
    <div style="width:96px;height:96px;border-radius:1.5rem;background:rgba(var(--danger)/0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <i data-lucide="file-x" style="width:48px;height:48px;color:rgb(var(--danger));"></i>
    </div>
    <div style="font-family:'Crimson Pro',Georgia,serif;font-size:5rem;font-weight:700;color:rgb(var(--text-primary));line-height:1;margin-bottom:0.5rem;">404</div>
    <h1 style="font-family:'Crimson Pro',Georgia,serif;font-size:1.75rem;font-weight:600;color:rgb(var(--text-primary));margin-bottom:0.75rem;">
      Page Not Found
    </h1>
    <p style="color:rgb(var(--text-muted));font-size:0.9375rem;line-height:1.65;margin-bottom:2rem;">
      Sorry, the page you're looking for doesn't exist or has been moved. Check the URL and try again.
    </p>
    <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
      <a href="/index.html" class="btn btn-primary" style="gap:0.375rem;text-decoration:none;">
        <i data-lucide="home" style="width:16px;height:16px;"></i>
        Back to Home
      </a>
      <button onclick="history.back()" class="btn btn-secondary">
        <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
        Go Back
      </button>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
